<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="StudioBook — every shoot, paid and delivered. A KARYA studio build.">
  <title>StudioBook — every shoot, paid and delivered</title>

  <!-- warm studio paper base -->
  <rect width="1200" height="630" fill="#F7F3F4"/>

  <!-- faint ledger rules -->
  <g stroke="#EEDFE3" stroke-width="2">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="230" x2="1200" y2="230"/>
    <line x1="0" y1="310" x2="1200" y2="310"/>
    <line x1="0" y1="390" x2="1200" y2="390"/>
    <line x1="0" y1="470" x2="1200" y2="470"/>
  </g>

  <!-- rose accent band down the left, like a ledger margin -->
  <rect x="0" y="0" width="18" height="630" fill="#e11d48"/>
  <rect x="90" y="0" width="2" height="630" fill="#FBDDE4"/>

  <!-- logo mark: camera / studio book -->
  <g transform="translate(96,74)">
    <rect x="0" y="6" width="74" height="60" rx="9" fill="#e11d48"/>
    <rect x="0" y="6" width="74" height="16" rx="8" fill="#9F1239"/>
    <circle cx="37" cy="42" r="17" fill="#F7F3F4"/>
    <circle cx="37" cy="42" r="8" fill="#e11d48"/>
  </g>

  <!-- brand name -->
  <text x="192" y="127" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="-1">
    <tspan fill="#20141A">Studio</tspan><tspan fill="#e11d48">Book</tspan>
  </text>

  <!-- headline -->
  <text x="96" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="90" font-weight="800" letter-spacing="-3" fill="#20141A">Every shoot,</text>
  <text x="96" y="404" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="90" font-weight="800" letter-spacing="-3" fill="#e11d48">paid &amp; delivered.</text>

  <!-- tagline -->
  <text x="98" y="480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="31" font-weight="500" fill="#574851">Shoot bookings, milestone payments &amp; album deadlines for studios.</text>

  <!-- footer row: KARYA wordmark + subscription note -->
  <g transform="translate(96,556)">
    <rect x="0" y="-26" width="150" height="42" rx="21" fill="#e11d48"/>
    <text x="75" y="2" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="3" fill="#F7F3F4">KARYA</text>
    <text x="172" y="1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#574851">studio build · subscription · pricing on discovery</text>
  </g>

  <!-- mini booking chip, top-right, echoing the product -->
  <g transform="translate(792,96)">
    <rect x="0" y="0" width="312" height="200" rx="16" fill="#FFFFFF" stroke="#E4C9D1" stroke-width="2"/>
    <text x="24" y="42" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" fill="#20141A">Sameer &amp; Pooja</text>
    <rect x="240" y="24" width="52" height="26" rx="13" fill="#FBDDE4"/>
    <text x="266" y="42" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#9F1239">Live</text>

    <text x="24" y="92" font-family="-apple-system, sans-serif" font-size="17" fill="#574851">Shoot-day balance</text>
    <rect x="204" y="76" width="88" height="24" rx="12" fill="#e11d48"/>
    <text x="248" y="93" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#F7F3F4">Paid</text>

    <text x="24" y="132" font-family="-apple-system, sans-serif" font-size="17" fill="#574851">Album delivery</text>
    <rect x="188" y="116" width="104" height="24" rx="12" fill="#FBEAD3"/>
    <text x="240" y="133" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#B45309">Due · 6 days</text>

    <line x1="24" y1="156" x2="288" y2="156" stroke="#EEDFE3" stroke-width="2"/>
    <text x="24" y="182" font-family="-apple-system, sans-serif" font-size="14" fill="#574851">Collected</text>
    <text x="288" y="182" text-anchor="end" font-family="'SF Mono', Menlo, monospace" font-size="16" font-weight="700" fill="#e11d48">Rs 2,55,000</text>
  </g>
</svg>
